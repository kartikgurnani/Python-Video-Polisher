# Dependabot configuration
# Manages dependency updates, security patches, and automation
#
# Docs:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ==========================
  # 🐍 Python dependencies
  # ==========================
  - package-ecosystem: "pip"
    directory: "/"                     # Root project directory
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "UTC"

    # Only open PRs for security updates
    open-pull-requests-limit: 85

    # Group all non-breaking updates together
    groups:
      python-dependencies:
        patterns:
          - "*"

    # Labels for automation
    labels:
      - "dependencies"
      - "python"
      - "security"

    # Auto-merge safe updates
    automerge: true
    rebase-strategy: "auto"

    # Ignore major version bumps (manual review)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ==========================
  # ⚙️ GitHub Actions
  # (Includes CodeQL)
  # ==========================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:30"
      timezone: "UTC"

    labels:
      - "dependencies"
      - "github-actions"
      - "ci"

    automerge: true
    rebase-strategy: "auto"

# ==========================
# 🔐 Security Updates
# ==========================
# Dependabot automatically prioritizes security advisories.
# This config ensures:
# - Security patches are always created
# - Safe updates are auto-merged
# - Major changes require manual approval

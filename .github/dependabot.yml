# Dependabot configuration
# Manages dependency updates, security patches, and automation
#
# Docs:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

vversion: 2

updates:
  # 🐍 Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ⚙️ GitHub Actions (CI, CodeQL, Sonar, Release tools)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"  # ==========================
  # ⚙️ GitHub Actions
  # (Includes CodeQL)
  # ==========================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:30"
      timezone: "UTC"

    labels:
      - "dependencies"
      - "github-actions"
      - "ci"

    automerge: true
    rebase-strategy: "auto"

# ==========================
# 🔐 Security Updates
# ==========================
# Dependabot automatically prioritizes security advisories.
# This config ensures:
# - Security patches are always created
# - Safe updates are auto-merged
# - Major changes require manual approval
